<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ========================================
           GLOBAL
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(37, 99, 235, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(124, 58, 237, 0.15),
                    transparent 30%
                ),

                #070b14;

            color: #e5e7eb;

            min-height: 100vh;

        }


        /* ========================================
           PAGES
        ======================================== */

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }


        /* ========================================
           MAIN CONTAINER
        ======================================== */

        .container {

            width: 92%;

            max-width: 1250px;

            margin: 45px auto;

        }


        /* ========================================
           HEADER
        ======================================== */

        header {

            text-align: center;

            margin-bottom: 40px;

        }

        header h1 {

            font-family: "Space Grotesk", sans-serif;

            font-size: 42px;

            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa,
                    #22d3ee
                );
                
                -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 10px;

        }

        header p {

            color: #94a3b8;

            font-size: 15px;

        }


        /* ========================================
           DASHBOARD CARDS
        ======================================== */

        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }

        .card {

            position: relative;

            background:
                rgba(15, 23, 42, 0.78);

            border:
                1px solid
                rgba(148, 163, 184, 0.12);

            padding: 27px 20px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(15px);

            transition: 0.3s;

            overflow: hidden;

        }

        .card:hover {

            transform: translateY(-7px);

            border-color:
                rgba(96, 165, 250, 0.35);

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.5);

        }

        .card h3 {

            color: #94a3b8;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 12px;

        }

        .card p {

            font-family: "Space Grotesk", sans-serif;

            font-size: 32px;

            font-weight: 700;

        }

        .card:nth-child(1) p {
            color: #60a5fa;
        }

        .card:nth-child(2) p {
            color: #22d3ee;
        }

        .card:nth-child(3) p {
            color: #fb7185;
        }

        .card:nth-child(4) p {
            color: #a78bfa;
        }


        /* ========================================
           FILTER
        ======================================== */

        .filters {

            background:
                rgba(15, 23, 42, 0.78);

            border:
                1px solid
                rgba(148, 163, 184, 0.12);

            padding: 22px 25px;

            border-radius: 18px;

            margin-bottom: 25px;

            backdrop-filter: blur(15px);

        }

        .filter-box {

            display: flex;

            align-items: center;

            gap: 15px;

        }

        .filter-box label {

            font-family: "Space Grotesk", sans-serif;

            color: #cbd5e1;

            font-weight: 600;

        }

        select {

            min-width: 230px;

            padding: 12px 16px;

            border-radius: 10px;

            border:
                1px solid #334155;

            background: #0f172a;

            color: #e2e8f0;

            font-size: 14px;

            cursor: pointer;

        }

        select:focus {

            outline: none;

            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.15);

        }


        /* ========================================
           TABLE
        ======================================== */

        .table-container {

            background:
                rgba(15, 23, 42, 0.82);

            border:
                1px solid
                rgba(148, 163, 184, 0.12);

            padding: 8px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);

            overflow-x: auto;

        }

        table {

            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

        }

        thead {

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #4338ca
                );

        }

        th {

            padding: 17px 15px;

            text-align: left;

            font-family: "Space Grotesk", sans-serif;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            color: white;

        }

        th:first-child {

            border-top-left-radius: 12px;

        }

        th:last-child {

            border-top-right-radius: 12px;

        }

        td {

            padding: 16px 15px;

            border-bottom:
                1px solid
                rgba(148, 163, 184, 0.08);

            color: #cbd5e1;

            font-size: 14px;

        }

        tbody tr {

            transition: 0.25s;

        }

        tbody tr:hover {

            background:
                rgba(59, 130, 246, 0.07);

        }

        tbody tr:last-child td {

            border-bottom: none;

        }


        /* ========================================
           PRODUCT LINK
        ======================================== */

        .product-link {

            color: #60a5fa;

            text-decoration: none;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;

        }

        .product-link:hover {

            color: #22d3ee;

            text-shadow:
                0 0 10px
                rgba(34, 211, 238, 0.5);

        }


        /* ========================================
           STATUS
        ======================================== */

        .status {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 110px;

            padding: 7px 13px;

            border-radius: 50px;

            font-size: 11px;

            font-weight: 700;

        }

        .available {

            background:
                rgba(34, 197, 94, 0.12);

            color: #4ade80;

            border:
                1px solid
                rgba(34, 197, 94, 0.25);

        }

        .low-stock {

            background:
                rgba(239, 68, 68, 0.12);

            color: #fb7185;

            border:
                1px solid
                rgba(239, 68, 68, 0.25);

        }


        /* ========================================
           PRODUCT DETAILS PAGE
        ======================================== */

        .product-page {

            width: 92%;

            max-width: 900px;

            margin: 50px auto;

        }

        .back-button {

            display: inline-block;

            margin-bottom: 25px;

            padding: 11px 18px;

            border-radius: 10px;

            background:
                rgba(37, 99, 235, 0.15);

            border:
                1px solid
                rgba(96, 165, 250, 0.25);

            color: #60a5fa;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }

        .back-button:hover {

            background:
                rgba(37, 99, 235, 0.25);

            transform: translateX(-4px);

        }


        /* ========================================
           PRODUCT DETAIL CARD
        ======================================== */

        .product-details {

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.95),
                    rgba(17, 24, 39, 0.95)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.15);

            border-radius: 25px;

            padding: 50px;

            text-align: center;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.5);

        }

        .product-icon {

            width: 90px;

            height: 90px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 0 35px
                rgba(59, 130, 246, 0.25);

        }

        .product-details h1 {

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 38px;

            margin-bottom: 8px;

            color: #f8fafc;

        }

        .product-category {

            color: #94a3b8;

            margin-bottom: 35px;

        }


        /* ========================================
           DETAILS GRID
        ======================================== */

        .details-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-bottom: 30px;

        }

        .detail-box {

            padding: 22px;

            border-radius: 15px;

            background:
                rgba(30, 41, 59, 0.65);

            border:
                1px solid
                rgba(148, 163, 184, 0.1);

            text-align: left;

        }

        .detail-box span {

            display: block;

            color: #64748b;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }

        .detail-box strong {

            color: #e2e8f0;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 20px;

        }


        /* ========================================
           PRODUCT STATUS
        ======================================== */

        .product-status {

            display: inline-block;

            padding: 10px 25px;

            border-radius: 50px;

            font-size: 13px;

            font-weight: 700;

        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 1000px) {

            .dashboard {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            header h1 {

                font-size: 36px;

            }

        }


        @media (max-width: 650px) {

            .container {

                width: 94%;

                margin: 25px auto;

            }

            header h1 {

                font-size: 28px;

            }

            .dashboard {

                grid-template-columns: 1fr;

            }

            .filter-box {

                flex-direction: column;

                align-items: flex-start;

            }

            select {

                width: 100%;

            }

            th,
            td {

                padding: 12px 10px;

                font-size: 12px;

                white-space: nowrap;

            }

            .product-details {

                padding: 30px 20px;

            }

            .product-details h1 {

                font-size: 29px;

            }

            .details-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         INVENTORY PAGE
    ======================================== -->

    <section
        id="inventoryPage"
        class="page active"
    >

        <div class="container">


            <header>

                <h1>
                    Inventory Management System
                </h1>

                <p>
                    Manage your products, stock and inventory
                </p>

            </header>


            <!-- Dashboard -->

            <div class="dashboard">


                <div class="card">

                    <h3>
                        Total Products
                    </h3>

                    <p id="totalProducts">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>
                        Total Stock
                    </h3>

                    <p id="totalStock">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>
                        Low Stock
                    </h3>

                    <p id="lowStock">
                        0
                    </p>

                </div>


                <div class="card">

                    <h3>
                        Inventory Value
                    </h3>

                    <p id="inventoryValue">
                        ₹0
                    </p>

                </div>


            </div>


            <!-- Category Filter -->

            <div class="filters">

                <div class="filter-box">

                    <label for="categoryFilter">
                        Category
                    </label>

                    <select id="categoryFilter">

                        <option value="All">
                            All Categories
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Furniture">
                            Furniture
                        </option>

                    </select>

                </div>

            </div>


            <!-- Product Table -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Product
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Stock
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="productTableBody">
                    </tbody>

                </table>

            </div>


        </div>

    </section>



    <!-- ========================================
         PRODUCT DETAILS PAGE
    ======================================== -->

    <section
        id="productPage"
        class="page"
    >

        <div class="product-page">


            <button
                class="back-button"
                onclick="showInventory()"
            >
                ← Back to Inventory
            </button>


            <div
                id="productDetails"
                class="product-details"
            >

            </div>


        </div>

    </section>



    <script>


        // ========================================
        // PRODUCT DATA
        // ========================================

        const products = [

            {
                id: 1,
                name: "Laptop",
                category: "Electronics",
                price: 50000,
                stock: 20
            },

            {
                id: 2,
                name: "Smartphone",
                category: "Electronics",
                price: 25000,
                stock: 15
            },

            {
                id: 3,
                name: "Headphones",
                category: "Accessories",
                price: 2000,
                stock: 8
            },

            {
                id: 4,
                name: "Keyboard",
                category: "Accessories",
                price: 1500,
                stock: 25
            },

            {
                id: 5,
                name: "Office Chair",
                category: "Furniture",
                price: 7000,
                stock: 5
            },

            {
                id: 6,
                name: "Monitor",
                category: "Electronics",
                price: 12000,
                stock: 12
            },

            {
                id: 7,
                name: "Mouse",
                category: "Accessories",
                price: 800,
                stock: 30
            },

            {
                id: 8,
                name: "Office Table",
                category: "Furniture",
                price: 10000,
                stock: 7
            }

        ];


        // ========================================
        // TOTAL PRODUCTS
        // ========================================

        function getTotalProducts() {

            return products.length;

        }


        // ========================================
        // TOTAL STOCK
        // ========================================

        function getTotalStock() {

            let total = 0;

            for (let product of products) {

                total += product.stock;

            }

            return total;

        }


        // ========================================
        // LOW STOCK
        // ========================================

        function getLowStockProducts() {

            return products.filter(function(product) {

                return product.stock < 10;

            });

        }


        // ========================================
        // INVENTORY VALUE
        // ========================================

        function getTotalInventoryValue() {

            let total = 0;

            for (let product of products) {

                total +=
                    product.price *
                    product.stock;

            }

            return total;

        }


        // ========================================
        // PRODUCT STATUS
        // ========================================

        function getProductStatus(stock) {

            if (stock < 10) {

                return "Low Stock";

            } else {

                return "Available";

            }

        }


        // ========================================
        // DISPLAY PRODUCTS
        // ========================================

        function displayProducts(productList) {

            const tableBody =
                document.getElementById(
                    "productTableBody"
                );

            tableBody.innerHTML = "";


            for (let product of productList) {

                const status =
                    getProductStatus(
                        product.stock
                    );


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${product.id}
                    </td>

                    <td>

                        <a
                            class="product-link"
                            onclick="showProduct(${product.id})"
                        >

                            ${product.name}

                        </a>

                    </td>

                    <td>
                        ${product.category}
                    </td>

                    <td>
                        ₹${product.price.toLocaleString("en-IN")}
                    </td>

                    <td>
                        ${product.stock}
                    </td>

                    <td>

                        <span class="status ${
                            status === "Low Stock"
                            ? "low-stock"
                            : "available"
                        }">

                            ${status}

                        </span>

                    </td>

                `;


                tableBody.appendChild(row);

            }

        }


        // ========================================
        // UPDATE DASHBOARD
        // ========================================

        function updateDashboard() {

            document.getElementById(
                "totalProducts"
            ).textContent =
                getTotalProducts();


            document.getElementById(
                "totalStock"
            ).textContent =
                getTotalStock();


            document.getElementById(
                "lowStock"
            ).textContent =
                getLowStockProducts().length;


            document.getElementById(
                "inventoryValue"
            ).textContent =
                "₹" +
                getTotalInventoryValue()
                    .toLocaleString("en-IN");

        }


        // ========================================
        // CATEGORY FILTER
        // ========================================

        document
            .getElementById("categoryFilter")
            .addEventListener(
                "change",
                function() {

                    const category =
                        this.value;


                    if (category === "All") {

                        displayProducts(
                            products
                        );

                    } else {

                        const filtered =
                            products.filter(
                                function(product) {

                                    return product.category ===
                                        category;

                                }
                            );


                        displayProducts(
                            filtered
                        );

                    }

                }
            );


        // ========================================
        // SHOW PRODUCT DETAILS
        // ========================================

        function showProduct(id) {

            /*
                find() is used here to
                find the clicked product.
            */

            const product =
                products.find(
                    function(item) {

                        return item.id === id;

                    }
                );


            if (!product) {

                return;

            }


            const status =
                getProductStatus(
                    product.stock
                );


            const productDetails =
                document.getElementById(
                    "productDetails"
                );


            productDetails.innerHTML = `

                <div class="product-icon">
                    📦
                </div>

                <h1>
                    ${product.name}
                </h1>

                <p class="product-category">
                    ${product.category}
                </p>


                <div class="details-grid">


                    <div class="detail-box">

                        <span>
                            Product ID
                        </span>

                        <strong>
                            #${product.id}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Category
                        </span>

                        <strong>
                            ${product.category}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Price
                        </span>

                        <strong>
                            ₹${product.price.toLocaleString("en-IN")}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Stock
                        </span>

                        <strong>
                            ${product.stock} Units
                        </strong>

                    </div>


                </div>


                <div class="
                    product-status
                    ${status === "Low Stock"
                    ? "low-stock"
                    : "available"}
                ">

                    ${status}

                </div>

            `;


            /*
                Hide inventory page
                and show product page.
            */

            document
                .getElementById(
                    "inventoryPage"
                )
                .classList.remove("active");


            document
                .getElementById(
                    "productPage"
                )
                .classList.add("active");


            window.scrollTo(0, 0);

        }


        // ========================================
        // BACK TO INVENTORY
        // ========================================

        function showInventory() {

            document
                .getElementById(
                    "productPage"
                )
                .classList.remove("active");


            document
                .getElementById(
                    "inventoryPage"
                )
                .classList.add("active");


            window.scrollTo(0, 0);

        }


        // ========================================
        // INITIAL LOAD
        // ========================================

        displayProducts(products);

        updateDashboard();


        // ========================================
        // CONSOLE TESTING
        // ========================================

        console.log(
            "Total Products:",
            getTotalProducts()
        );

        console.log(
            "Total Stock:",
            getTotalStock()
        );

        console.log(
            "Low Stock Products:",
            getLowStockProducts()
        );

        console.log(
            "Total Inventory Value:",
            getTotalInventoryValue()
        );

    </script>

</body>
</html>
